[workspace]
members = ["crates/sec-guard-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Dickson Abdul-Wahab"]
repository = "https://github.com/dabdul-wahab1988/sec-guard-action"
homepage = "https://github.com/dabdul-wahab1988/sec-guard-action"

[workspace.dependencies]
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.24"

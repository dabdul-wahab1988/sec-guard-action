[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "sec-guard"
version = "0.1.0"
description = "Optional Python remediation agent for sec-guard-action"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dickson Abdul-Wahab" }]
dependencies = [
    "openai==2.53.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "PyYAML==6.0.3"]

[project.scripts]
sec-guard-agent = "sec_guard.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["python/sec_guard/sec_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
